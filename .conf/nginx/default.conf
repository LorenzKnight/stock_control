# SCRIPT LOCAL
server {
    listen 80;
    listen [::]:80;

    server_name allstockcontrol.com www.allstockcontrol.com *.allstockcontrol.com;

    root /app/public;
    index stock.php index.php index.html index.htm;

    client_max_body_size 100m;

    # Logs dentro del contenedor (tú ya los montas a ./var/log/nginx)
    access_log /var/log/nginx/allstockcontrol.access.log;
    error_log  /var/log/nginx/allstockcontrol.error.log;

    # --- WebSocket (LOCAL) ---
    # Si el ws-server corre en tu Mac:
    location /ws {
        proxy_pass http://host.docker.internal:3001;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;

        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # --- Bridge notify (LOCAL) ---
    # Si el bridge corre en tu Mac:
    location /notify {
        proxy_pass http://host.docker.internal:3002;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Idiomas
    location ~ ^/(es|en|sv)/?$ {
        set $lang $1;
        rewrite ^/(es|en|sv)/?$ /stock.php?lang=$lang last;
    }

    # Ruteo app
    location / {
        try_files $uri $uri/ $uri.php /stock.php?$args;
    }

    # PHP-FPM dentro de Docker (NO snippets, NO socket)
    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass php:9000;
    }
}

