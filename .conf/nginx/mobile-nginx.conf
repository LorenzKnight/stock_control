# =========================
# mobile.allstockcontrol.com (React static)
# =========================
server {
    listen 80;
    listen [::]:80;

    server_name mobile.allstockcontrol.com;

    root /var/www/mobile.allstockcontrol.com/build;
    index index.html;

    # Let's Encrypt challenge
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
        allow all;
        try_files $uri =404;
    }

    # React SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache para assets
    location ~* \.(?:css|js|mjs|map|json|jpg|jpeg|png|gif|ico|svg|webp|woff|woff2|ttf|eot|mp3|mp4)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
        access_log off;
    }

    access_log /var/log/nginx/mobile.allstockcontrol.access.log;
    error_log  /var/log/nginx/mobile.allstockcontrol.error.log;
}