server {
    listen 80;
    listen [::]:80;

    server_name allstockcontrol.com www.allstockcontrol.com *.allstockcontrol.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
        allow all;
        try_files $uri =404;
    }

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name allstockcontrol.com www.allstockcontrol.com *.allstockcontrol.com;

    root /var/www/allstockcontrol/public;
    index stock.php index.php index.html index.htm;

    client_max_body_size 100m;

    ssl_certificate /etc/letsencrypt/live/allstockcontrol.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/allstockcontrol.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location /ws {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;

        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /notify {
        proxy_pass http://127.0.0.1:3002;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/(es|en|sv)/?$ {
        set $lang $1;
        rewrite ^/(es|en|sv)/?$ /stock.php?lang=$lang last;
    }

    location / {
        try_files $uri $uri/ $uri.php /stock.php?$args;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    access_log /var/log/nginx/allstockcontrol.access.log;
    error_log  /var/log/nginx/allstockcontrol.error.log;
}










