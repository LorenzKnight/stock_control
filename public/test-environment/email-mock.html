<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset='UTF-8'>
    <style>
        body { font-family: Arial, sans-serif; background:#f5f5f5; }
        .box { background:#fff; padding:30px; max-width:750px; margin:auto; }
        .header { text-align: left; border-bottom: 1px solid #eee; }
        .email-logo { text-align:center; width:70px; filter: brightness(0) saturate(105%) invert(11%) sepia(87%) saturate(6795%) hue-rotate(195deg) brightness(82%) contrast(105%); }
        .content { height:70vh; font-size:14px; padding-top:20px; }
        .info { font-size:12px; color:#777; margin-top:10px; }
        .footer { font-size:12px; color:#777; text-align:center; margin-top:20px; }
    </style>
</head>
<body>
    <div class='box'>
        <div class="header">
            <img class='email-logo' src='https://allstockcontrol.com/images/sys-img/asc-logo.png' alt='AllStockControl'>
        </div>
        <div class='content'>    
            Hi <strong>{$data['name']}</strong>,<br><br>

            Thank you for registering at <strong>AllStockControl</strong>.<br><br>

            To activate your account, click here:<br><br>

            <a href='{$verifyLink}'
                style='display:inline-block; padding:10px 22px;
                background:#2e86de; color:#fff;
                text-decoration:none; border-radius:4px;
            '>
                Verify my account
            </a>

            <br><br>
            <p class="info">This link is valid for 24 hours.</p>
        </div>
    </div>
    <div class='footer'>
        © " . date('Y') . " AllStockControl · support@allstockcontrol.com
    </div>
</body>
</html>
